meters:
- name: video_points
  description: Video points consumed per generated clip; scales with model, resolution, and duration.
  unit: points
  aggregation: sum
  dimensions:
  - account
  - model
  - resolution
  - duration
- name: llm_tokens
  description: Tokens consumed by chat completions, billed per million.
  unit: tokens
  aggregation: sum
  dimensions:
  - account
  - model
- name: tts_characters
  description: Characters synthesized by the text-to-speech API, billed per character.
  unit: characters
  aggregation: sum
  dimensions:
  - account
  - model
- name: subscription_credits
  description: Consumer Hailuo AI monthly credit pool drawn down per video/image generation.
  unit: credits
  aggregation: sum
  dimensions:
  - account
  - plan
principles:
- name: Visibility
  description: Track video points per model/resolution/duration and token/character throughput per API so the video line item is not conflated with text/audio.
- name: Allocation
  description: Tag API keys per workload/team so video-point and token spend maps to internal cost centers.
- name: Optimization
  description: Right-size model tier and resolution/duration to the delivery need; use the Fast/02 variants for drafts and reserve 1080P for finals; use prompt_optimizer to cut failed retries (failures are not billed).
- name: Accountability
  description: Review monthly video-point burn against forecast; watch for high-resolution long-duration clips that dominate cost.
