description: >-
  FinOps view of Hailuo AI / MiniMax spend. On the developer platform, cost is
  consumption-based across distinct meters: video generation is metered in video
  points per clip (driven by model, resolution, and duration), LLM chat is metered
  per token, and text-to-speech is metered per character. Consumer Hailuo AI plans
  are flat monthly subscriptions that grant a credit pool. The dominant and most
  variable line item for API teams is video generation, where per-clip cost scales
  sharply with resolution (512P to 1080P) and duration (6s to 10s). Failed or
  security-blocked generations are not billed.
notes: >-
  Per-unit video-point and per-token rates change; verify on
  platform.minimax.io/docs/guides/pricing-video. Optimize by matching model tier
  (e.g. MiniMax-Hailuo-02 or the Fast variant) and resolution/duration to the
  actual delivery need, and by using prompt_optimizer to reduce wasted retries.
