name: Hailuo AI / MiniMax
kind: company
description: Hailuo AI is MiniMax's generative video and audio platform. MiniMax is
  a Singapore- and China-based foundation-model company whose developer platform
  (platform.minimax.io / api.minimax.io, and intl.minimaxi.com for international
  users) exposes documented HTTP APIs for AI video generation (the Hailuo
  text-to-video and image-to-video models - MiniMax-Hailuo-2.3, MiniMax-Hailuo-02,
  Video-01, T2V-01, I2V-01, S2V-01), large language model chat completions (the
  MiniMax / abab family), text-to-speech (T2A) over both HTTP and a real-time
  WebSocket, music generation, and voice cloning. Video generation follows an
  asynchronous create-task-then-poll pattern; all APIs authenticate with a Bearer
  API key.
